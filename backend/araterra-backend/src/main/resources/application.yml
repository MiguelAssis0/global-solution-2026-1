spring:
  jpa:
    show-sql: true
  application:
    name: demo

api:
  security:
    skip-paths:
      - /h2-console
      - /swagger-ui.html
      - /v3/api-docs
      - /swagger-ui/**
    token:
      secret: ${JWT_SECRET:my-secret}
      refresh-secret: ${JWT_REFRESH_SECRET:my-refresh-secret}
      expiration: ${JWT_TIME:2}
    gemini:
      api-key: ${GOOGLE_API_KEY}

---

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

